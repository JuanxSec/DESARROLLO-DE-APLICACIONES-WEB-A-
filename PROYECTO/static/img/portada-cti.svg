<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-label="Centro de inteligencia de amenazas: panel de monitoreo con indicadores y alertas">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3057"/><stop offset="1" stop-color="#11998e"/></linearGradient>
    <linearGradient id="pico" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7fe7d4" stop-opacity=".15"/>
      <stop offset="1" stop-color="#7fe7d4" stop-opacity=".75"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#fondo)"/>
  <g stroke="#ffffff" stroke-opacity=".07">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <!-- panel principal -->
  <rect x="48" y="52" width="352" height="196" rx="10" fill="#0b2239" fill-opacity=".72"
        stroke="#7fe7d4" stroke-opacity=".35"/>
  <text x="68" y="80" fill="#7fe7d4" font-family="Segoe UI,Arial,sans-serif" font-size="13"
        letter-spacing="2">FLUJO DE AMENAZAS</text>
  <path d="M68 214 108 188 148 198 188 150 228 166 268 122 308 140 348 104 380 118"
        fill="none" stroke="#7fe7d4" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M68 214 108 188 148 198 188 150 228 166 268 122 308 140 348 104 380 118V228H68Z"
        fill="url(#pico)"/>
  <g fill="#7fe7d4"><circle cx="188" cy="150" r="3.5"/><circle cx="268" cy="122" r="3.5"/>
     <circle cx="348" cy="104" r="3.5"/></g>
  <!-- tarjetas de indicadores -->
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="424" y="52" width="168" height="58" rx="8" fill="#0b2239" fill-opacity=".72"
          stroke="#7fe7d4" stroke-opacity=".35"/>
    <text x="440" y="76" fill="#9fb3c8" font-size="11" letter-spacing="1">BOLETINES</text>
    <text x="440" y="98" fill="#ffffff" font-size="20" font-weight="600">Semanales</text>
    <rect x="424" y="122" width="168" height="58" rx="8" fill="#0b2239" fill-opacity=".72"
          stroke="#f6c453" stroke-opacity=".45"/>
    <text x="440" y="146" fill="#9fb3c8" font-size="11" letter-spacing="1">ALERTAS</text>
    <text x="440" y="168" fill="#f6c453" font-size="20" font-weight="600">Criticas</text>
    <rect x="424" y="192" width="168" height="56" rx="8" fill="#0b2239" fill-opacity=".72"
          stroke="#7fe7d4" stroke-opacity=".35"/>
    <text x="440" y="216" fill="#9fb3c8" font-size="11" letter-spacing="1">INFORMES</text>
    <text x="440" y="238" fill="#ffffff" font-size="20" font-weight="600">Mensuales</text>
  </g>
  <!-- escudo -->
  <g transform="translate(268 262) scale(1.5)">
    <path d="M16 2 4 6v8c0 7 5 12.4 12 14 7-1.6 12-7 12-14V6Z" fill="#7fe7d4" fill-opacity=".18"
          stroke="#7fe7d4" stroke-width="1.6"/>
    <path d="M10.5 15.5 14.5 19.5 22 12" fill="none" stroke="#7fe7d4" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="320" y="330" text-anchor="middle" fill="#dbe7f0"
        font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="3">
    CIBERINTELIGENCIA APLICADA</text>
</svg>
