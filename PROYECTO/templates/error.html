{% extends "base.html" %}

{% block content %}
<section class="seccion" style="padding-top: 9rem; min-height: 70vh">
    <div class="container text-center" style="max-width: 620px">
        <div class="display-1 fw-bold texto-acento" style="font-family:'Space Grotesk',sans-serif">{{ codigo }}</div>
        <h1 class="h3">{{ titulo }}</h1>
        <p class="text-muted">{{ mensaje }}</p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-acento" href="{{ url_for('inicio') }}"><i class="bi bi-house me-1"></i>Ir al inicio</a>
            {% if current_user.is_authenticated %}
            <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Volver al panel</a>
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}
