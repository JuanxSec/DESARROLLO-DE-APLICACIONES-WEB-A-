{% extends "base.html" %}

{% block content %}

<section class="caja">
    <h2>Clientes</h2>
    <p>
        En este módulo se muestran clientes demostrativos relacionados con el proyecto JuansecCTI.
    </p>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Sector</th>
                    <th>Servicio</th>
                </tr>
            </thead>

            <tbody>
                {% for cliente in clientes %}
                <tr>
                    <td>{{ cliente.nombre }}</td>
                    <td>{{ cliente.sector }}</td>
                    <td>{{ cliente.servicio }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>

{% endblock %}
